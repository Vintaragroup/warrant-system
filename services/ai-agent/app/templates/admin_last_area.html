<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Last Known Area – {{ name }}</title>
  <link href="https://unpkg.com/maplibre-gl@3.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.7.1/dist/maplibre-gl.js"></script>
  <style>
    body{margin:0;font:16px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,system-ui,sans-serif}
    #map{height:calc(100vh - 70px);width:100%}
    header{padding:14px 18px;border-bottom:1px solid #eee}
    .muted{color:#666}
  </style>
</head>
<body>
  <header>
    <div><strong>{{ name }}</strong> — Case #{{ case_id }}</div>
    <div class="muted">Last update: {{ ts }}</div>
  </header>
  <div id="map"></div>
  <script>
    const center = [{{ geo.lon or 0 }}, {{ geo.lat or 0 }}];
    const accKm = {{ geo.accuracy_km or 25 }};
    const radiusMeters = accKm * 1000;

    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json',
      center: center,
      zoom: 10
    });

    map.addControl(new maplibregl.NavigationControl());

    function drawCircle(center, radius) {
      const steps = 64, coords = [];
      const [lon, lat] = center;
      const R = 6378137;
      for (let i=0;i<=steps;i++){
        const theta = (i/steps)*(Math.PI*2);
        const dx = (radius * Math.cos(theta)) / (R * Math.cos(lat*Math.PI/180));
        const dy = (radius * Math.sin(theta)) / R;
        coords.push([lon + dx * 180/Math.PI, lat + dy * 180/Math.PI]);
      }
      return {
        "type":"Feature",
        "geometry":{"type":"Polygon","coordinates":[coords]}
      };
    }

    map.on('load', ()=>{
      map.addSource('accuracy', { type:'geojson', data: drawCircle(center, radiusMeters) });
      map.addLayer({
        id:'accuracy-fill', type:'fill', source:'accuracy',
        paint:{ 'fill-color':'#3b82f6', 'fill-opacity':0.18 }
      });
      map.addLayer({
        id:'accuracy-outline', type:'line', source:'accuracy',
        paint:{ 'line-color':'#1e3a8a', 'line-width':2 }
      });
      new maplibregl.Marker().setLngLat(center).addTo(map);
    });
  </script>
</body>
</html>
