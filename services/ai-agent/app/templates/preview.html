<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ title }}</title>

  <!-- Social preview -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ og_title }}">
  <meta property="og:description" content="{{ og_desc }}">
  <meta property="og:url" content="{{ og_url }}">
  <meta property="og:image" content="{{ og_image }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ og_title }}">
  <meta name="twitter:description" content="{{ og_desc }}">
  <meta name="twitter:image" content="{{ og_image }}">

  <link rel="stylesheet" href="{{ beacon_css }}">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{font:16px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,system-ui,sans-serif;margin:0;padding:24px;line-height:1.4;background:#f8f9fb;color:#111}
    .card{max-width:720px;margin:0 auto;background:#fff;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.06);padding:20px}
    .cta{display:inline-block;background:#111;color:#fff;border-radius:10px;padding:12px 16px;font-weight:600;text-decoration:none}
    .muted{color:#666}
    img{max-width:100%;border-radius:12px;display:block;margin:8px 0 16px}
  </style>
</head>
<body>
  <div class="card">
    <h1>Required Check‑In</h1>
    <p class="muted">{{ name }} — Case #{{ case_id }}</p>
    <img src="{{ og_image }}" alt="Compliance Notice">
    <p>Tap below to begin secure verification.</p>
    <p><a class="cta" href="{{ action_url }}">Start now</a></p>
    <img src="{{ beacon_px }}" width="1" height="1" alt="">
  </div>
</body>
</html>
