version: "1"
services:
  # Web API (FastAPI/Uvicorn) — optional if you only need background jobs
  - type: web
    name: warrant-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: warrantdb

  # Background worker used by scheduled jobs
  - type: worker
    name: warrant-pipeline
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: sleep infinity
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: warrantdb
      - key: HARRIS_BASE_FILES_URL
        value: https://www.hcdistrictclerk.com/Common/e-services/Files
      - key: HARRIS_DATASETS_PAGE
        value: https://www.hcdistrictclerk.com/Common/e-services/PublicDatasets.aspx

# ── V2 Staging Cron Jobs ──────────────────────────────────────────────────────
#
# These jobs write to STAGING collections only (v2_galveston_events,
# v2_harris_reports, v2_report_manifest).  They do NOT touch any production
# collection.  They are commented out (prefixed with "# ") so they do not
# deploy until manually enabled.
#
# Prerequisites before enabling:
#   1. Run scripts/create_v2_indexes.py against the target Atlas database.
#   2. Set MONGO_URI / MONGO_DB in the Render service environment.
#   3. Confirm smoke test passes: PYTHONPATH=$PWD python3 scripts/smoke_test_ingestion_v2.py
#
# Do NOT add USE_V2_GALVESTON=true to the production warrant-pipeline worker
# until the Galveston upsert-key migration is complete.
#
# Uncomment the blocks below to activate each staging job.

# - type: cron
#   name: v2-galveston-staging
