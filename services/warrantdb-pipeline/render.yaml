# Fort Bend and Jefferson lookup jobs are intentionally omitted from scheduled
# cron.  Lookups require a specific name query and are best triggered on-demand
# or as part of the enrichment pipeline when a subject name is known.
# See scripts/run_ingestion_v2.py --source fortbend_lookup / jefferson_lookup.

# Brazoria is disabled until the pubweb.brazoriacountytx.gov network/source
# issue is resolved and tested on Render.  Do not enable until a successful
# staging write is confirmed outside the local network.

