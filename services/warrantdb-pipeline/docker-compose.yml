version: "3.9"
services:
  api:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      # Production shares one MongoDB database between the dashboard and this
      # pipeline (see docs/architecture/OVERVIEW.md) — the local sandbox
      # mirrors that: point at the dashboard's local Mongo (apps/dashboard,
      # docker-compose.dev.yml, host port 27018), not the standalone `mongo`
      # service below. host.docker.internal is the Docker Desktop hostname
      # for reaching the host machine from inside a container.
      - MONGO_URI=mongodb://host.docker.internal:27018
      - MONGO_DB=warrantdb
  mongo:
    image: mongo:7
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data:
