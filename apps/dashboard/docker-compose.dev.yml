services:
  mailhog:
    # Local SMTP server for development/testing invites
    image: mailhog/mailhog:latest
    profiles: ["hotreload"]
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI http://localhost:8025
  mongo:
    image: mongo:7
    ports:
      - "27018:27017" # use 27018 on host to avoid conflicts with a local mongod
    volumes:
      - mongo-data:/data/db
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      # Map to 6381 on host to avoid conflicts with any local Redis
      - "6381:6379"
    volumes:
      - redis-data:/data
  api:
    profiles: ["static"]
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - PORT=8080
      - NODE_ENV=development
      # Explicit local sandbox Mongo — do NOT leave this unset. server/.env's
      # default is host-oriented (localhost:27018) for scripts run outside
      # Docker; dotenv won't override an already-set env var, so this line is
      # what keeps the container itself off the real Atlas cluster. If you
      # deliberately want this container against Atlas, override MONGO_URI
      # here explicitly — never make Atlas the silent default again.
      - MONGO_URI=mongodb://mongo:27017
      - WEB_ORIGIN=${WEB_ORIGIN:-http://localhost:5173}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      # Enrichment proxy target (UI backend forwards /api/enrichment/* to this base)
      - ENRICHMENT_API_URL=${ENRICHMENT_API_URL:-http://host.docker.internal:4000}
      # SMTP (optional; when set, server will email invite links)
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
      - APP_NAME=${APP_NAME:-Bail Bonds Dashboard}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
      - API_PUBLIC_URL=${API_PUBLIC_URL:-http://localhost:8080}
      - SESSION_SECRET=${SESSION_SECRET:-dev-only-insecure-session-secret}
    volumes:
      - ./server/src:/app/src
      - ./server/src/openapi.yaml:/app/openapi.yaml
    ports:
      - "8080:8080"
    depends_on:
      - mongo
      - redis
    command: node src/index.js
  api-dev:
    profiles: ["hotreload"]
    image: node:20-alpine
    working_dir: /app
    environment:
      - PORT=8080
      - NODE_ENV=development
      # Explicit local sandbox Mongo — do NOT leave this unset. server/.env's
      # default is host-oriented (localhost:27018) for scripts run outside
      # Docker; dotenv won't override an already-set env var, so this line is
      # what keeps the container itself off the real Atlas cluster. If you
      # deliberately want this container against Atlas, override MONGO_URI
      # here explicitly — never make Atlas the silent default again.
      - MONGO_URI=mongodb://mongo:27017
      - WEB_ORIGIN=${WEB_ORIGIN:-http://localhost:5173}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      # Enrichment proxy target (UI backend forwards /api/enrichment/* to this base)
      - ENRICHMENT_API_URL=${ENRICHMENT_API_URL:-http://host.docker.internal:4000}
      # Default to local MailHog in the compose network
      - SMTP_HOST=${SMTP_HOST:-mailhog}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${EMAIL_FROM:-no-reply@localhost}
      - APP_NAME=${APP_NAME:-Bail Bonds Dashboard}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
      - API_PUBLIC_URL=${API_PUBLIC_URL:-http://localhost:8080}
      - SESSION_SECRET=${SESSION_SECRET:-dev-only-insecure-session-secret}
    command: ["sh", "-lc", "npm install --no-audit --no-fund && npm run dev"]
    ports:
      - "8080:8080"
    volumes:
      - ./server:/app
      - api_dev_node_modules:/app/node_modules
    depends_on:
      - mongo
      - redis
      - mailhog
  web:
    profiles: ["static"]
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "5173:80"
    volumes:
      - ./public/env.js:/usr/share/nginx/html/env.js:ro
    depends_on:
      - api
  web-dev:
    profiles: ["hotreload"]
    image: node:20-alpine
    working_dir: /app
    environment:
      # Keep SPA requests same-origin to enable first-party cookies on iOS
      - VITE_API_URL=${VITE_API_URL_DEV:-/api}
      # Point Vite's proxy to the API; in compose, the service hostname is 'api-dev'
      - VITE_PROXY_API_TARGET=${VITE_PROXY_API_TARGET:-http://api-dev:8080}
    command: sh -c "npm ci --legacy-peer-deps && npm run dev -- --host --port 5173"
    ports:
      - "5175:5173"
    volumes:
      - ./:/app
      - web_dev_node_modules:/app/node_modules
    depends_on:
      - api-dev
volumes:
  mongo-data:
  redis-data:
  web_dev_node_modules:
  api_dev_node_modules:
