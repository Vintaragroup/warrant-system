services:
  - name: warrantdb-api
    type: web
    runtime: docker
    plan: starter
    # Docker build from monorepo — rootDir scopes everything below (including
    # dockerfilePath/dockerContext) to apps/dashboard/, matching where this
    # service's code actually lives in warrant-system.
    rootDir: apps/dashboard
    dockerfilePath: server/Dockerfile
    dockerContext: ./server
    # Health check for container readiness (lightweight, no DB)
    healthCheckPath: /api/health/light
    # Restrict auto-deploys to a stable branch
    autoDeploy: false
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # set in Render Dashboard or via env group
      - key: MONGO_DB
        value: warrantdb
      - key: WEB_ORIGIN
        sync: false # the frontend's origin (Vercel URL) — required for CORS + cookie sameSite=none
      # SMTP settings for invitation emails
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APP_NAME
        value: Bail Bonds Dashboard
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: API_PUBLIC_URL
        sync: false # e.g. https://warrantdb-api.onrender.com — used to build the Google OAuth callback URL
      - key: SESSION_SECRET
        sync: false # generate with `openssl rand -hex 32`
      # Telnyx messaging (see server/src/lib/messaging/telnyx.js) — added 2026-08-24,
      # after the Twilio->Telnyx migration. Messaging degrades gracefully without
      # these set; not required for the core dashboard (auth/cases/CRM) to work.
      - key: TELNYX_API_KEY
        sync: false
      - key: TELNYX_MESSAGING_FROM_NUMBER
        sync: false
      - key: TELNYX_MESSAGING_PROFILE_ID
        sync: false
      - key: TELNYX_PUBLIC_KEY
        sync: false

# Frontend deploys to Vercel instead (apps/dashboard, Vite static build) —
# decided 2026-08-24. No staticSites block here anymore; see Vercel project
# "warrant-system" (rootDirectory: apps/dashboard) for the frontend deploy.

previews:
  generation: manual