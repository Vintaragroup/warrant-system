name: warrant-system

# Consolidated orchestration compose for all three services.
# Each service can also be run independently from its own directory using its own compose file.
#
# Usage from repo root:
#   docker compose -f infra/docker/docker-compose.yml up -d
#   docker compose -f infra/docker/docker-compose.yml up -d inmate-enrichment-api inmate-enrichment-worker
#
# Build contexts are relative to this file location (infra/docker/), so they point up two levels.

services:

  # ─── inmate-enrichment ───────────────────────────────────────────────────────

  ie-mongo:
    image: mongo:6
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - ie-mongo-data:/data/db
    # Not exposed on host — internal to this stack only

  ie-mongo-setup:
    image: mongo:6
    depends_on:
      - ie-mongo
    entrypoint:
      - bash
      - -lc
      - >
        until mongosh --host ie-mongo:27017 --eval 'db.runCommand({ ping: 1 })' >/dev/null 2>&1;
        do sleep 1; done;
        mongosh --host ie-mongo:27017
        --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"ie-mongo:27017"}]})' || true

  ie-redis:
    image: redis:7
    restart: unless-stopped
    # Not exposed on host — internal to this stack only

  ie-api:
    build:
      context: ../../services/inmate-enrichment
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      - MONGO_URI=${IE_MONGO_URI:-mongodb://ie-mongo:27017/inmate_enrichment?replicaSet=rs0}
      - MONGO_DB=${IE_MONGO_DB:-inmate_enrichment}
      - SUBJECTS_COLLECTION=${IE_SUBJECTS_COLLECTION:-subjects}
      - REDIS_URL=${IE_REDIS_URL:-redis://ie-redis:6379}
      - PORT=${IE_API_PORT:-4000}
      - ENRICHMENT_WINDOW_HOURS=${IE_ENRICHMENT_WINDOW_HOURS}
      - IDEMPOTENCY_WINDOW_SECONDS=${IE_IDEMPOTENCY_WINDOW_SECONDS}
      - PROVIDER_WHITEPAGES_ENABLED=${IE_PROVIDER_WHITEPAGES_ENABLED}
      - PARTY_PULL_PREFER_STATEWIDE=${IE_PARTY_PULL_PREFER_STATEWIDE}
      - PDL_API_KEY=${IE_PDL_API_KEY}
      - WHITEPAGES_API_KEY=${IE_WHITEPAGES_API_KEY}
      - OPENAI_API_KEY=${IE_OPENAI_API_KEY}
      - PIPL_API_KEY=${IE_PIPL_API_KEY}
      - PROVIDER_PIPL_ENABLED=${IE_PROVIDER_PIPL_ENABLED}
      - AUTO_ENRICH_ENABLED=${IE_AUTO_ENRICH_ENABLED}
      - AUTO_ENRICH_SWEEP_CRON=${IE_AUTO_ENRICH_SWEEP_CRON}
      - RAW_PAYLOAD_TTL_HOURS=${IE_RAW_PAYLOAD_TTL_HOURS}
      - QUEUE_CONCURRENCY=${IE_QUEUE_CONCURRENCY}
      - BOND_THRESHOLD=${IE_BOND_THRESHOLD}
      - HCSO_SCRAPE_ENABLED=${IE_HCSO_SCRAPE_ENABLED}
      - HCSO_BASE_URL=${IE_HCSO_BASE_URL}
      - HCSO_SCRAPE_MODE=${IE_HCSO_SCRAPE_MODE}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      - ie-mongo
      - ie-mongo-setup
      - ie-redis

  ie-worker:
    build:
      context: ../../services/inmate-enrichment
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    environment:
      - MONGO_URI=${IE_MONGO_URI:-mongodb://ie-mongo:27017/inmate_enrichment?replicaSet=rs0}
      - MONGO_DB=${IE_MONGO_DB:-inmate_enrichment}
      - SUBJECTS_COLLECTION=${IE_SUBJECTS_COLLECTION:-subjects}
      - REDIS_URL=${IE_REDIS_URL:-redis://ie-redis:6379}
      - ENRICHMENT_WINDOW_HOURS=${IE_ENRICHMENT_WINDOW_HOURS}
      - IDEMPOTENCY_WINDOW_SECONDS=${IE_IDEMPOTENCY_WINDOW_SECONDS}
      - PROVIDER_WHITEPAGES_ENABLED=${IE_PROVIDER_WHITEPAGES_ENABLED}
      - PARTY_PULL_PREFER_STATEWIDE=${IE_PARTY_PULL_PREFER_STATEWIDE}
      - PDL_API_KEY=${IE_PDL_API_KEY}
      - WHITEPAGES_API_KEY=${IE_WHITEPAGES_API_KEY}
      - OPENAI_API_KEY=${IE_OPENAI_API_KEY}
      - PIPL_API_KEY=${IE_PIPL_API_KEY}
      - PROVIDER_PIPL_ENABLED=${IE_PROVIDER_PIPL_ENABLED}
      - RAW_PAYLOAD_TTL_HOURS=${IE_RAW_PAYLOAD_TTL_HOURS}
      - QUEUE_CONCURRENCY=${IE_QUEUE_CONCURRENCY}
      - BOND_THRESHOLD=${IE_BOND_THRESHOLD}
      - HCSO_SCRAPE_ENABLED=${IE_HCSO_SCRAPE_ENABLED}
      - HCSO_BASE_URL=${IE_HCSO_BASE_URL}
      - HCSO_SCRAPE_MODE=${IE_HCSO_SCRAPE_MODE}
    depends_on:
      - ie-mongo
      - ie-mongo-setup
      - ie-redis

  # ─── bail-bonds-dashboard ────────────────────────────────────────────────────

  dashboard-mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - dashboard-mongo-data:/data/db

  dashboard-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "6381:6379"
    volumes:
      - dashboard-redis-data:/data

  dashboard-api:
    build:
      context: ../../apps/dashboard/server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=${DASHBOARD_API_PORT:-8080}
      - MONGO_URI=${DASHBOARD_MONGO_URI}
      - MONGO_DB=${DASHBOARD_MONGO_DB:-warrantdb}
      - NODE_ENV=development
      - WEB_ORIGIN=${DASHBOARD_WEB_ORIGIN:-http://localhost:5173}
      - REDIS_URL=${DASHBOARD_REDIS_URL:-redis://dashboard-redis:6379/0}
      - ENRICHMENT_API_URL=${DASHBOARD_ENRICHMENT_API_URL:-http://ie-api:4000}
      - SMTP_HOST=${DASHBOARD_SMTP_HOST}
      - SMTP_PORT=${DASHBOARD_SMTP_PORT:-587}
      - SMTP_SECURE=${DASHBOARD_SMTP_SECURE:-false}
      - SMTP_USER=${DASHBOARD_SMTP_USER}
      - SMTP_PASS=${DASHBOARD_SMTP_PASS}
      - EMAIL_FROM=${DASHBOARD_EMAIL_FROM}
      - APP_NAME=${DASHBOARD_APP_NAME:-Bail Bonds Dashboard}
      - GOOGLE_OAUTH_CLIENT_ID=${DASHBOARD_GOOGLE_OAUTH_CLIENT_ID}
      - GOOGLE_OAUTH_CLIENT_SECRET=${DASHBOARD_GOOGLE_OAUTH_CLIENT_SECRET}
      - API_PUBLIC_URL=${DASHBOARD_API_PUBLIC_URL:-http://localhost:8080}
      - SESSION_SECRET=${DASHBOARD_SESSION_SECRET:-dev-only-insecure-session-secret}
    ports:
      - "${DASHBOARD_API_PORT:-8080}:${DASHBOARD_API_PORT:-8080}"
    # /api/health/light is the liveness probe — always 200, no DB calls.
    # /api/health (full) does a Mongo ping but can be slow under load; use light for Docker.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health/light"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    depends_on:
      - dashboard-mongo
      - dashboard-redis
    command: node src/index.js

  # ─── warrantdb-pipeline ──────────────────────────────────────────────────────
  #
  # FUTURE DIRECTION — Shared Mongo replica set
  # ─────────────────────────────────────────────
  # The separate Mongo services below (ie-mongo, dashboard-mongo, pipeline-mongo,
  # ai-agent-mongo) are intended to be consolidated into a single shared replica set:
  #
  #   warrant-mongo:
  #     image: mongo:7
  #     command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
  #
  # Each service will continue to use its own database name on that shared host:
  #   - warrantdb          (bail-bonds-dashboard)
  #   - inmate_enrichment  (inmate-enrichment api + worker)
  #   - warrantdb_pipeline (warrantdb-pipeline api)
  #   - ai_agent           (ai-agent) — must stay a distinct database even after
  #     consolidation; it has its own `checkins` collection that would collide
  #     with the dashboard's `checkins` collection under the same database.
  #
  # Future shared URI pattern:
  #   mongodb://warrant-mongo:27017/?replicaSet=rs0
  #
  # DO NOT remove the existing per-service Mongo instances until that migration is tested.

  pipeline-mongo:
    image: mongo:7
    restart: always
    ports:
      - "27019:27017"
    volumes:
      - pipeline-mongo-data:/data/db

  pipeline-api:
    build:
      context: ../../services/warrantdb-pipeline
    restart: unless-stopped
    ports:
      - "${PIPELINE_API_PORT:-8081}:${PIPELINE_API_PORT:-8081}"
    environment:
      - MONGO_URI=${PIPELINE_MONGO_URI:-mongodb://pipeline-mongo:27017/warrantdb_pipeline}
      - MONGO_DB=${PIPELINE_MONGO_DB:-warrantdb_pipeline}
      - PORT=${PIPELINE_API_PORT:-8081}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - pipeline-mongo

  # ─── ai-agent ─────────────────────────────────────────────────────────────
  #
  # Deliberately on its own Mongo instance/database, not shared with
  # dashboard-mongo — it has its own `checkins` collection (compliance
  # check-in flow) which would collide with the dashboard's own `checkins`
  # collection (GPS check-in pings) if pointed at the same database.

  ai-agent-mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27020:27017"
    volumes:
      - ai-agent-mongo-data:/data/db

  ai-agent-api:
    build:
      context: ../../services/ai-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - MONGO_URI=${AI_AGENT_MONGO_URI:-mongodb://ai-agent-mongo:27017/ai_agent}
      - MONGO_DB=${AI_AGENT_MONGO_DB:-ai_agent}
      - APP_ENV=${AI_AGENT_APP_ENV:-development}
      - SECRET_KEY=${AI_AGENT_SECRET_KEY:-dev-only-insecure-secret}
      - BASE_URL=${AI_AGENT_BASE_URL:-http://localhost:8082}
      - TELNYX_API_KEY=${AI_AGENT_TELNYX_API_KEY}
      - TELNYX_MESSAGING_FROM_NUMBER=${AI_AGENT_TELNYX_MESSAGING_FROM_NUMBER}
      - TELNYX_MESSAGING_PROFILE_ID=${AI_AGENT_TELNYX_MESSAGING_PROFILE_ID}
      - TELNYX_TOOL_TOKEN=${AI_AGENT_TELNYX_TOOL_TOKEN:-dev-only-placeholder-token}
      - TELNYX_WEBHOOK_SECRET=${AI_AGENT_TELNYX_WEBHOOK_SECRET}
      - TWILIO_ACCOUNT_SID=${AI_AGENT_TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${AI_AGENT_TWILIO_AUTH_TOKEN}
      - TWILIO_FROM_NUMBER=${AI_AGENT_TWILIO_FROM_NUMBER}
      - TWILIO_MESSAGING_SERVICE_SID=${AI_AGENT_TWILIO_MESSAGING_SERVICE_SID}
      - TWILIO_USE_WHATSAPP=${AI_AGENT_TWILIO_USE_WHATSAPP:-false}
      - TWILIO_WHATSAPP_FROM=${AI_AGENT_TWILIO_WHATSAPP_FROM}
      - AWS_ACCESS_KEY_ID=${AI_AGENT_AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AI_AGENT_AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AI_AGENT_AWS_REGION:-us-east-2}
      - S3_BUCKET=${AI_AGENT_S3_BUCKET}
      - ONCALL_AGENTS_JSON=${AI_AGENT_ONCALL_AGENTS_JSON}
      - OFFICE_ROUTES_JSON=${AI_AGENT_OFFICE_ROUTES_JSON}
      - DEFAULT_OFFICE_NUMBER=${AI_AGENT_DEFAULT_OFFICE_NUMBER}
      - STATIC_TRANSFER_NUMBERS_JSON=${AI_AGENT_STATIC_TRANSFER_NUMBERS_JSON}
      - OFFICE_CALLER_ID=${AI_AGENT_OFFICE_CALLER_ID}
      - OFFICES_SCHEDULE_JSON=${AI_AGENT_OFFICES_SCHEDULE_JSON}
      - APP_TZ=${AI_AGENT_APP_TZ:-America/Chicago}
      - DIAL_ATTEMPT_TIMEOUT_SEC=${AI_AGENT_DIAL_ATTEMPT_TIMEOUT_SEC:-20}
      - TRANSFER_ACCEPT_DIGIT=${AI_AGENT_TRANSFER_ACCEPT_DIGIT:-1}
      - TRANSFER_DECLINE_DIGIT=${AI_AGENT_TRANSFER_DECLINE_DIGIT:-2}
      - HOLD_MUSIC_URL=${AI_AGENT_HOLD_MUSIC_URL}
      - IP_GEO_PROVIDER=${AI_AGENT_IP_GEO_PROVIDER:-none}
      - IP_GEO_TOKEN=${AI_AGENT_IP_GEO_TOKEN}
      - IP_GEO_TTL_SEC=${AI_AGENT_IP_GEO_TTL_SEC:-86400}
    ports:
      - "${AI_AGENT_API_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - ai-agent-mongo

volumes:
  ie-mongo-data: {}
  dashboard-mongo-data: {}
  dashboard-redis-data: {}
  pipeline-mongo-data: {}
  ai-agent-mongo-data: {}
